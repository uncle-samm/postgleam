name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the full CI before publishing.
  workflow_call:

jobs:
  test:
    name: Build, test, and docs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure PostgreSQL for replication tests
        run: |
          docker exec "${{ job.services.postgres.id }}" bash -lc "cat >> /var/lib/postgresql/data/postgresql.conf <<'EOF'
          wal_level = logical
          max_wal_senders = 10
          max_replication_slots = 10
          password_encryption = 'scram-sha-256'
          EOF"
          docker restart "${{ job.services.postgres.id }}"
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 1; done

      - name: Enable TLS on PostgreSQL for the TLS tests
        run: |
          ./scripts/make_test_certs.sh build/tls
          container="${{ job.services.postgres.id }}"
          docker cp build/tls/server.crt "$container":/var/lib/postgresql/data/server.crt
          docker cp build/tls/server.key "$container":/var/lib/postgresql/data/server.key
          docker exec "$container" bash -lc "chown postgres:postgres /var/lib/postgresql/data/server.* && chmod 600 /var/lib/postgresql/data/server.key && printf \"ssl = on\nssl_cert_file = 'server.crt'\nssl_key_file = 'server.key'\n\" >> /var/lib/postgresql/data/postgresql.conf"
          docker restart "$container"
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do sleep 1; done
          psql "host=$PGHOST port=$PGPORT user=$PGUSER sslmode=verify-full sslrootcert=build/tls/ca.pem" -tc "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()"

      - name: Start PgBouncer (transaction pooling) for the PgBouncer tests
        run: |
          sudo apt-get install -y pgbouncer
          # The package starts a system instance on 6432; use our own config.
          sudo systemctl stop pgbouncer || true
          mkdir -p /tmp/pgb
          cat > /tmp/pgb/pgbouncer.ini <<'EOF'
          [databases]
          postgleam_test = host=127.0.0.1 port=5432 dbname=postgleam_test
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = scram-sha-256
          auth_file = /tmp/pgb/userlist.txt
          pool_mode = transaction
          default_pool_size = 2
          max_client_conn = 100
          logfile = /tmp/pgb/pgbouncer.log
          pidfile = /tmp/pgb/pgbouncer.pid
          EOF
          echo '"postgres" "postgres"' > /tmp/pgb/userlist.txt
          /usr/sbin/pgbouncer -d /tmp/pgb/pgbouncer.ini

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"

      - name: Install dependencies
        run: gleam deps download

      - name: Check formatting
        run: make format-check

      - name: Set up test database
        run: |
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -f test/setup.sql
          psql -h 127.0.0.1 -p 6432 -U "$PGUSER" postgleam_test -tc "SELECT 'pgbouncer ok'"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Build docs
        run: make docs

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run smoke script
        run: ./scripts/smoke_test.sh
