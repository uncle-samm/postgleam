name = "postgleam"
version = "0.9.0"
description = "A PostgreSQL driver for Gleam, implementing the wire protocol in Gleam"
licences = ["Apache-2.0"]
repository = { type = "github", user = "uncle-samm", repo = "postgleam" }
gleam = ">= 1.19.0"
internal_modules = [
  "postgleam/internal",
  "postgleam/internal/*",
  "postgleam/message",
  "postgleam/auth/*",
]

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
mug = ">= 3.1.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
gleamy_bench = ">= 0.6.0 and < 1.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
